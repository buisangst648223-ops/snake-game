<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>贪吃蛇</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(30, 10, 60, 0.6) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(10, 30, 60, 0.6) 0%, transparent 60%),
        radial-gradient(ellipse at 60% 80%, rgba(20, 40, 20, 0.4) 0%, transparent 50%);
      pointer-events: none;
    }

    .game-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      position: relative;
      z-index: 1;
    }

    .title {
      font-size: 2.8rem;
      font-weight: 900;
      letter-spacing: 4px;
      background: linear-gradient(135deg, #00ff88, #00ccff, #aa44ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 20px rgba(0, 255, 136, 0.4));
      animation: titlePulse 3s ease-in-out infinite;
    }

    @keyframes titlePulse {
      0%, 100% { filter: drop-shadow(0 0 20px rgba(0, 255, 136, 0.4)); }
      50%       { filter: drop-shadow(0 0 35px rgba(0, 204, 255, 0.7)); }
    }

    .score-panel {
      display: flex;
      gap: 32px;
      align-items: center;
    }

    .score-box {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 10px 24px;
      text-align: center;
      backdrop-filter: blur(10px);
      min-width: 110px;
    }

    .score-label {
      font-size: 0.7rem;
      color: rgba(255,255,255,0.5);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .score-value {
      font-size: 1.8rem;
      font-weight: 700;
      color: #00ff88;
      text-shadow: 0 0 12px rgba(0,255,136,0.6);
      transition: transform 0.15s ease;
    }

    .score-value.pop { transform: scale(1.3); }

    #best-score-value {
      color: #ffcc00;
      text-shadow: 0 0 12px rgba(255,204,0,0.6);
    }

    .canvas-container {
      position: relative;
      border-radius: 16px;
      padding: 3px;
      background: linear-gradient(135deg, #00ff88, #00ccff, #aa44ff, #ff4488, #00ff88);
      background-size: 300% 300%;
      animation: borderAnim 4s linear infinite;
      box-shadow: 0 0 40px rgba(0,255,136,0.2), 0 0 80px rgba(0,204,255,0.1);
    }

    @keyframes borderAnim {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    canvas { display: block; border-radius: 14px; background: #050510; }

    .overlay {
      position: absolute;
      inset: 3px;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
      background: rgba(5,5,16,0.92);
      backdrop-filter: blur(6px);
      transition: opacity 0.4s ease;
      z-index: 10;
    }

    .overlay.hidden { opacity: 0; pointer-events: none; }

    .overlay-icon {
      font-size: 5rem;
      animation: float 2.5s ease-in-out infinite;
      filter: drop-shadow(0 0 20px rgba(0,255,136,0.5));
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-12px); }
    }

    .overlay-title {
      font-size: 2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #00ff88, #00ccff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 3px;
    }

    .overlay-sub {
      color: rgba(255,255,255,0.5);
      font-size: 0.9rem;
      letter-spacing: 1px;
      text-align: center;
      line-height: 1.9;
    }

    .overlay-sub .tag {
      display: inline-block;
      background: rgba(255,120,0,0.2);
      border: 1px solid rgba(255,120,0,0.4);
      border-radius: 4px;
      padding: 1px 6px;
      font-size: 0.75rem;
      color: #ff9944;
      margin: 0 2px;
    }

    .overlay-score-display { text-align: center; }

    .overlay-score-display .big-score {
      font-size: 4rem;
      font-weight: 900;
      color: #00ff88;
      text-shadow: 0 0 20px rgba(0,255,136,0.8);
      line-height: 1;
    }

    .overlay-score-display .score-desc {
      font-size: 0.8rem;
      color: rgba(255,255,255,0.4);
      letter-spacing: 2px;
      margin-top: 4px;
    }

    .new-record {
      font-size: 1rem;
      color: #ffcc00;
      font-weight: 700;
      letter-spacing: 2px;
      text-shadow: 0 0 12px rgba(255,204,0,0.8);
      animation: blink 0.8s ease-in-out infinite alternate;
    }

    @keyframes blink {
      from { opacity: 0.6; }
      to   { opacity: 1; transform: scale(1.05); }
    }

    .btn {
      padding: 14px 48px;
      border: none;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 3px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, #00ff88, #00ccff);
      color: #050510;
      box-shadow: 0 4px 24px rgba(0,255,136,0.4);
    }

    .btn-primary:hover  { transform: translateY(-2px) scale(1.03); box-shadow: 0 8px 32px rgba(0,255,136,0.6); }
    .btn-primary:active { transform: translateY(0) scale(0.98); }

    .btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent);
      border-radius: inherit;
    }

    .controls-hint {
      display: flex;
      gap: 20px;
      align-items: center;
      color: rgba(255,255,255,0.35);
      font-size: 0.78rem;
      letter-spacing: 1px;
    }

    .key { display: inline-flex; align-items: center; gap: 6px; }

    .key-badge {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 0.7rem;
      font-family: monospace;
      color: rgba(255,255,255,0.6);
    }

    .level-bar-container {
      width: 100%;
      max-width: 460px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .level-label { font-size: 0.7rem; color: rgba(255,255,255,0.4); letter-spacing: 1px; white-space: nowrap; }

    .level-bar-bg {
      flex: 1;
      height: 4px;
      background: rgba(255,255,255,0.08);
      border-radius: 2px;
      overflow: hidden;
    }

    .level-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #00ff88, #00ccff);
      border-radius: 2px;
      transition: width 0.3s ease;
      box-shadow: 0 0 8px rgba(0,255,136,0.6);
      width: 0%;
    }

    .level-value { font-size: 0.75rem; color: #00ff88; font-weight: 700; min-width: 20px; text-align: right; }

    /* NPC 图例 */
    .legend {
      display: flex;
      gap: 20px;
      font-size: 0.72rem;
      color: rgba(255,255,255,0.35);
      letter-spacing: 1px;
    }

    .legend-dot {
      width: 10px; height: 10px;
      border-radius: 3px;
      display: inline-block;
      margin-right: 5px;
      vertical-align: middle;
    }

    #particles { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  </style>
</head>
<body>

<canvas id="particles"></canvas>

<div class="game-wrapper">
  <div class="title">🐍 贪吃蛇</div>

  <div class="score-panel">
    <div class="score-box">
      <div class="score-label">当前分数</div>
      <div class="score-value" id="score-value">0</div>
    </div>
    <div class="score-box">
      <div class="score-label">最高记录</div>
      <div class="score-value" id="best-score-value">0</div>
    </div>
  </div>

  <div class="level-bar-container">
    <span class="level-label">等级</span>
    <div class="level-bar-bg">
      <div class="level-bar-fill" id="level-bar"></div>
    </div>
    <span class="level-value" id="level-value">1</span>
  </div>

  <div class="canvas-container">
    <canvas id="gameCanvas" width="460" height="460"></canvas>

    <!-- 开始界面 -->
    <div class="overlay" id="start-overlay">
      <div class="overlay-icon"><img src="cat.jpg" alt="cat" style="width:90px;height:90px;border-radius:50%;object-fit:cover;box-shadow:0 0 24px rgba(255,200,80,0.7),0 0 48px rgba(255,160,40,0.3);"></div>
      <div class="overlay-title">贪吃蛇</div>
      <div class="overlay-sub">
        控制绿色的蛇，吃掉地图里的小猫食物得分<br>
        <span class="tag">NPC蛇</span> 橙色的蛇会在地图里随机游荡<br>
        避免撞墙和自身，挑战最高记录！
      </div>
      <button class="btn btn-primary" id="start-btn">开始游戏</button>
      <div class="controls-hint">
        <span class="key"><span class="key-badge">↑↓←→</span> 或 <span class="key-badge">WASD</span> 移动</span>
        <span class="key"><span class="key-badge">Space</span> 暂停</span>
      </div>
    </div>

    <!-- 结束界面 -->
    <div class="overlay hidden" id="gameover-overlay">
      <div class="overlay-icon" id="gameover-icon">💀</div>
      <div class="overlay-title" id="gameover-title">游戏结束</div>
      <div class="overlay-score-display">
        <div class="big-score" id="final-score">0</div>
        <div class="score-desc">本局得分</div>
      </div>
      <div class="new-record hidden" id="new-record-badge">🏆 新纪录！</div>
      <button class="btn btn-primary" id="restart-btn">再来一局</button>
    </div>
  </div>

  <div class="legend">
    <span><span class="legend-dot" style="background:#00ff88;"></span>你的蛇（qianling）</span>
    <span><span class="legend-dot" style="background:#ff8833;"></span>NPC蛇（wo）</span>
    <span><span class="legend-dot" style="background:#ffcc44;border-radius:50%;"></span>猫咪食物</span>
  </div>

  <div class="controls-hint" style="color:rgba(255,255,255,0.25);">
    <span class="key"><span class="key-badge">Space</span> 暂停 / 继续</span>
    <span class="key"><span class="key-badge">ESC</span> 返回主菜单</span>
  </div>
</div>

<script>
// ─── 图片资源 ─────────────────────────────────────────────
const imgPlayer = new Image();
imgPlayer.src = 'qianling.jpg';

const imgNpc = new Image();
imgNpc.src = 'wo.jpg';

const imgFood = new Image();
imgFood.src = 'cat.jpg';

// ─── 星空背景粒子 ─────────────────────────────────────────
(function initStars() {
  const cv = document.getElementById('particles');
  const cx = cv.getContext('2d');
  let W, H, stars = [];

  function resize() { W = cv.width = window.innerWidth; H = cv.height = window.innerHeight; }

  function makeStar() {
    return { x: Math.random()*W, y: Math.random()*H, r: Math.random()*1.2+0.2,
             speed: Math.random()*0.003+0.001, phase: Math.random()*Math.PI*2 };
  }

  function init() { resize(); stars = Array.from({length:120}, makeStar); }

  function draw(t) {
    cx.clearRect(0,0,W,H);
    stars.forEach(s => {
      const a = 0.3 + 0.5*Math.sin(t*s.speed*1000 + s.phase);
      cx.beginPath(); cx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      cx.fillStyle = `rgba(255,255,255,${a})`; cx.fill();
    });
    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', resize);
  init();
  requestAnimationFrame(draw);
})();

// ─── 游戏常量 ─────────────────────────────────────────────
const canvas = document.getElementById('gameCanvas');
const ctx    = canvas.getContext('2d');
const COLS   = 23, ROWS = 23;
const CELL   = canvas.width / COLS; // 20

// DOM
const scoreEl         = document.getElementById('score-value');
const bestEl          = document.getElementById('best-score-value');
const levelEl         = document.getElementById('level-value');
const levelBar        = document.getElementById('level-bar');
const startOverlay    = document.getElementById('start-overlay');
const gameoverOverlay = document.getElementById('gameover-overlay');
const finalScoreEl    = document.getElementById('final-score');
const newRecordEl     = document.getElementById('new-record-badge');
const gameoverIcon    = document.getElementById('gameover-icon');
const gameoverTitle   = document.getElementById('gameover-title');

// 状态
let snake, dir, nextDir;
let npcSnake, npcDir;
let food, bonus;
let score, bestScore, level, speed;
let gameState = 'idle'; // idle | running | paused | over
let loopTimer = null;
let bonusTimer = null;
let particles = [];

bestScore = parseInt(localStorage.getItem('snakeBest') || '0');
bestEl.textContent = bestScore;

// ─── 初始化 ───────────────────────────────────────────────
function initGame() {
  // 玩家蛇：地图中央向右
  const cx = Math.floor(COLS / 2), cy = Math.floor(ROWS / 2);
  snake   = [{ x: cx, y: cy }, { x: cx-1, y: cy }, { x: cx-2, y: cy }];
  dir     = { x: 1, y: 0 };
  nextDir = { x: 1, y: 0 };

  // NPC 蛇：左上角区域向右，5节
  npcSnake = [
    { x: 17, y: 4 }, { x: 16, y: 4 }, { x: 15, y: 4 },
    { x: 14, y: 4 }, { x: 13, y: 4 }
  ];
  npcDir = { x: 1, y: 0 };

  food      = randomFood();
  bonus     = null;
  score     = 0;
  level     = 1;
  speed     = 220;
  particles = [];
  updateHUD();
  drawFrame();
}

// ─── 工具函数 ─────────────────────────────────────────────
function randInt(min, max) { return Math.floor(Math.random() * (max - min)) + min; }

function randomFood(exclude = []) {
  const occupied = new Set([
    ...snake.map(s => `${s.x},${s.y}`),
    ...(npcSnake || []).map(s => `${s.x},${s.y}`),
    ...exclude.map(e => `${e.x},${e.y}`)
  ]);
  let pos;
  do { pos = { x: randInt(0, COLS), y: randInt(0, ROWS) }; }
  while (occupied.has(`${pos.x},${pos.y}`));
  return pos;
}

// 方向 → 旋转角度（图片默认朝右）
function getDirRotation(d) {
  if (d.x ===  1) return 0;
  if (d.x === -1) return Math.PI;
  if (d.y === -1) return -Math.PI / 2;
  return Math.PI / 2;
}

// ─── NPC 逻辑 ─────────────────────────────────────────────
function tickNpc() {
  const head = npcSnake[0];
  const nextPos = { x: head.x + npcDir.x, y: head.y + npcDir.y };
  const hitWall = nextPos.x < 0 || nextPos.x >= COLS || nextPos.y < 0 || nextPos.y >= ROWS;

  // 撞墙必须转向；有 12% 概率随机改变方向
  if (hitWall || Math.random() < 0.12) {
    const allDirs = [{ x:1,y:0 }, { x:-1,y:0 }, { x:0,y:1 }, { x:0,y:-1 }];
    const validDirs = allDirs.filter(d => {
      if (d.x === -npcDir.x && d.y === -npcDir.y) return false; // 不能 180° 掉头
      const p = { x: head.x + d.x, y: head.y + d.y };
      return p.x >= 0 && p.x < COLS && p.y >= 0 && p.y < ROWS;
    });

    if (validDirs.length > 0) {
      npcDir = validDirs[Math.floor(Math.random() * validDirs.length)];
    } else {
      // 死角：只能掉头
      npcDir = { x: -npcDir.x, y: -npcDir.y };
    }
  }

  // 钳制到地图内（安全保护）
  const newHead = {
    x: Math.max(0, Math.min(COLS - 1, npcSnake[0].x + npcDir.x)),
    y: Math.max(0, Math.min(ROWS - 1, npcSnake[0].y + npcDir.y))
  };
  npcSnake.unshift(newHead);
  npcSnake.pop(); // 固定长度，NPC 不生长
}

// ─── 游戏循环 ─────────────────────────────────────────────
function startLoop() {
  clearTimeout(loopTimer);
  loopTimer = setTimeout(tick, speed);
}

function tick() {
  if (gameState !== 'running') return;

  tickNpc();

  dir = { ...nextDir };
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) return endGame();
  if (snake.some(s => s.x === head.x && s.y === head.y)) return endGame();

  snake.unshift(head);

  let grew = false;

  // 吃食物
  if (head.x === food.x && head.y === food.y) {
    grew = true;
    score += 10 * level;
    spawnParticles(food.x, food.y, '#ffaa22');
    food = randomFood();
    if (score % 50 === 0 && !bonus) spawnBonus();
    updateSpeed();
    popScore();
  }

  // 吃奖励食物
  if (bonus && head.x === bonus.x && head.y === bonus.y) {
    grew = true;
    score += 50 * level;
    spawnParticles(bonus.x, bonus.y, '#ffcc00');
    bonus = null;
    popScore();
  }

  if (!grew) snake.pop();

  updateHUD();
  drawFrame();
  startLoop();
}

function updateSpeed() {
  const newLevel = Math.floor(score / 200) + 1;
  if (newLevel > level) level = Math.min(newLevel, 10);
  speed = Math.max(110, 220 - (level - 1) * 12);
}

function updateHUD() {
  scoreEl.textContent = score;
  levelEl.textContent = level;
  levelBar.style.width = ((score % 200) / 200 * 100) + '%';
  if (score > bestScore) { bestScore = score; bestEl.textContent = bestScore; }
}

function popScore() {
  scoreEl.classList.remove('pop');
  void scoreEl.offsetWidth;
  scoreEl.classList.add('pop');
  setTimeout(() => scoreEl.classList.remove('pop'), 150);
}

// ─── 奖励食物 ─────────────────────────────────────────────
function spawnBonus() {
  bonus = randomFood([food]);
  clearTimeout(bonusTimer);
  bonusTimer = setTimeout(() => { bonus = null; }, 8000);
}

// ─── 粒子效果 ─────────────────────────────────────────────
function spawnParticles(gx, gy, color) {
  const cx = (gx + 0.5) * CELL, cy = (gy + 0.5) * CELL;
  const cr = parseInt(color.slice(1,3), 16);
  const cg = parseInt(color.slice(3,5), 16);
  const cb = parseInt(color.slice(5,7), 16);
  for (let i = 0; i < 12; i++) {
    const angle = (Math.PI * 2 / 12) * i + Math.random() * 0.5;
    const spd = 1.5 + Math.random() * 2;
    particles.push({
      x: cx, y: cy,
      vx: Math.cos(angle) * spd,
      vy: Math.sin(angle) * spd,
      r: 2 + Math.random() * 2,
      life: 1, cr, cg, cb
    });
  }
}

// ─── 绘制主循环 ───────────────────────────────────────────
function drawFrame() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawGrid();
  drawParticles();
  drawFood();
  if (bonus) drawBonusFood();
  drawNpcSnake();
  drawPlayerSnake();
}

function drawGrid() {
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 0.5;
  for (let i = 0; i <= COLS; i++) {
    ctx.beginPath(); ctx.moveTo(i*CELL, 0); ctx.lineTo(i*CELL, canvas.height); ctx.stroke();
  }
  for (let j = 0; j <= ROWS; j++) {
    ctx.beginPath(); ctx.moveTo(0, j*CELL); ctx.lineTo(canvas.width, j*CELL); ctx.stroke();
  }
}

// ─── 食物（cat.jpg，1.9× 格子大小）────────────────────────
function drawFood() {
  const fx = food.x * CELL, fy = food.y * CELL;
  const cx = fx + CELL/2, cy = fy + CELL/2;
  const t = Date.now() / 600;
  const pulse = 1 + 0.14 * Math.sin(t);
  const FS = CELL * 1.9; // 食物显示边长

  // 外层大光晕
  const grd = ctx.createRadialGradient(cx, cy, 0, cx, cy, CELL * 1.6 * pulse);
  grd.addColorStop(0, 'rgba(255,210,80,0.6)');
  grd.addColorStop(0.5, 'rgba(255,160,40,0.25)');
  grd.addColorStop(1, 'rgba(255,160,40,0)');
  ctx.beginPath();
  ctx.arc(cx, cy, CELL * 1.6 * pulse, 0, Math.PI * 2);
  ctx.fillStyle = grd;
  ctx.fill();

  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(pulse, pulse);

  if (imgFood.complete && imgFood.naturalWidth > 0) {
    roundRect(ctx, -FS/2 + 1, -FS/2 + 1, FS - 2, FS - 2, 8);
    ctx.clip();
    ctx.drawImage(imgFood, -FS/2, -FS/2, FS, FS);
  } else {
    ctx.font = `${CELL * 1.6}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🐱', 0, 2);
  }

  ctx.restore();
}

function drawBonusFood() {
  const x = bonus.x * CELL, y = bonus.y * CELL;
  const cx = x + CELL/2, cy = y + CELL/2;
  const t = Date.now() / 400;
  const pulse = 1 + 0.18 * Math.sin(t);

  const grd = ctx.createRadialGradient(cx, cy, 0, cx, cy, CELL * pulse);
  grd.addColorStop(0, 'rgba(255,220,0,0.4)');
  grd.addColorStop(1, 'rgba(255,220,0,0)');
  ctx.beginPath();
  ctx.arc(cx, cy, CELL * pulse, 0, Math.PI * 2);
  ctx.fillStyle = grd;
  ctx.fill();

  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(pulse, pulse);
  ctx.font = `${CELL * 0.82}px serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('⭐', 0, 1);
  ctx.restore();
}

// ─── 玩家蛇 ───────────────────────────────────────────────
function drawPlayerSnake() {
  const len = snake.length;
  snake.forEach((seg, i) => {
    if (i === 0) {
      drawHeadGlow(seg, 'rgba(0,255,136,0.3)', 'rgba(0,255,136,0)');
      drawHeadImage(imgPlayer, seg, dir, '#00ff88');
    } else {
      drawBodySeg(seg, i / len, true);
    }
  });
}

// ─── NPC 蛇 ───────────────────────────────────────────────
function drawNpcSnake() {
  const len = npcSnake.length;
  npcSnake.forEach((seg, i) => {
    if (i === 0) {
      drawHeadGlow(seg, 'rgba(255,120,0,0.3)', 'rgba(255,120,0,0)');
      drawHeadImage(imgNpc, seg, npcDir, '#ff8833');
    } else {
      drawBodySeg(seg, i / len, false);
    }
  });
}

// 蛇头光晕（与放大后的头部等比）
function drawHeadGlow(seg, colorIn, colorOut) {
  const cx = seg.x * CELL + CELL/2, cy = seg.y * CELL + CELL/2;
  const R = CELL * 2.4;
  const grd = ctx.createRadialGradient(cx, cy, 0, cx, cy, R);
  grd.addColorStop(0, colorIn);
  grd.addColorStop(1, colorOut);
  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, Math.PI * 2);
  ctx.fillStyle = grd;
  ctx.fill();
}

// 蛇头图片（2.2× 身体格大小，支持朝向旋转）
function drawHeadImage(img, seg, segDir, fallback) {
  const cx = seg.x * CELL + CELL/2;
  const cy = seg.y * CELL + CELL/2;
  const rotation = getDirRotation(segDir);
  const S = CELL * 2.2; // 头部边长：2.2倍格子

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rotation);

  if (img.complete && img.naturalWidth > 0) {
    roundRect(ctx, -S/2 + 1, -S/2 + 1, S - 2, S - 2, 8);
    ctx.clip();
    ctx.drawImage(img, -S/2, -S/2, S, S);
  } else {
    ctx.fillStyle = fallback;
    roundRect(ctx, -S/2 + 1.5, -S/2 + 1.5, S - 3, S - 3, 8);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.6)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  ctx.restore();
}

// 蛇身节段（玩家 = 绿色系，NPC = 橙色系）
function drawBodySeg(seg, t, isPlayer) {
  const x = seg.x * CELL, y = seg.y * CELL;
  const pad = 1.5, rx = 5;
  const alpha = 1 - t * 0.25;

  let r, g, b;
  if (isPlayer) {
    r = 0;
    g = Math.round(255 - t * 100);
    b = Math.round(136 + t * 80);
  } else {
    r = Math.round(255 - t * 75);
    g = Math.round(150 - t * 90);
    b = Math.round(50  - t * 40);
  }

  const segGrd = ctx.createLinearGradient(x, y, x + CELL, y + CELL);
  segGrd.addColorStop(0, `rgba(${r},${g},${b},${alpha})`);
  segGrd.addColorStop(1, `rgba(${Math.max(r-20,0)},${Math.max(g-30,0)},${Math.max(b-10,0)},${alpha*0.85})`);

  roundRect(ctx, x+pad, y+pad, CELL-pad*2, CELL-pad*2, rx);
  ctx.fillStyle = segGrd;
  ctx.fill();

  // 高光
  ctx.fillStyle = `rgba(255,255,255,${Math.max(0.15 - t * 0.12, 0)})`;
  roundRect(ctx, x+pad+2, y+pad+2, (CELL-pad*2)*0.55, (CELL-pad*2)*0.3, 3);
  ctx.fill();
}

// ─── 粒子绘制 ─────────────────────────────────────────────
function drawParticles() {
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.1;
    p.life -= 0.04;
  });
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${p.cr},${p.cg},${p.cb},${p.life})`;
    ctx.fill();
  });
}

// ─── 工具：圆角矩形路径 ──────────────────────────────────
function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x+r, y);
  c.lineTo(x+w-r, y);
  c.quadraticCurveTo(x+w, y, x+w, y+r);
  c.lineTo(x+w, y+h-r);
  c.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  c.lineTo(x+r, y+h);
  c.quadraticCurveTo(x, y+h, x, y+h-r);
  c.lineTo(x, y+r);
  c.quadraticCurveTo(x, y, x+r, y);
  c.closePath();
}

// ─── 动画主循环 ───────────────────────────────────────────
function animLoop() {
  if (gameState === 'running') drawFrame();
  requestAnimationFrame(animLoop);
}
requestAnimationFrame(animLoop);

// ─── 游戏结束 ─────────────────────────────────────────────
function endGame() {
  gameState = 'over';
  clearTimeout(loopTimer);
  clearTimeout(bonusTimer);

  const isRecord = score >= bestScore && score > 0;
  if (isRecord) { localStorage.setItem('snakeBest', bestScore); bestEl.textContent = bestScore; }

  finalScoreEl.textContent = score;
  newRecordEl.classList.toggle('hidden', !isRecord);
  gameoverIcon.textContent  = score > 200 ? '🏆' : '💀';
  gameoverTitle.textContent = score > 200 ? '太厉害了！' : '游戏结束';
  gameoverOverlay.classList.remove('hidden');
}

// ─── 按钮事件 ─────────────────────────────────────────────
document.getElementById('start-btn').addEventListener('click', () => {
  startOverlay.classList.add('hidden');
  initGame();
  gameState = 'running';
  startLoop();
});

document.getElementById('restart-btn').addEventListener('click', () => {
  gameoverOverlay.classList.add('hidden');
  initGame();
  gameState = 'running';
  startLoop();
});

// ─── 键盘控制 ─────────────────────────────────────────────
const DIRS = {
  ArrowUp:    {x:0,y:-1}, w:{x:0,y:-1}, W:{x:0,y:-1},
  ArrowDown:  {x:0,y:1},  s:{x:0,y:1},  S:{x:0,y:1},
  ArrowLeft:  {x:-1,y:0}, a:{x:-1,y:0}, A:{x:-1,y:0},
  ArrowRight: {x:1,y:0},  d:{x:1,y:0},  D:{x:1,y:0}
};

document.addEventListener('keydown', e => {
  const d = DIRS[e.key];
  if (d) {
    e.preventDefault();
    if (gameState === 'running' && (d.x !== -dir.x || d.y !== -dir.y)) nextDir = d;
  }
  if (e.key === ' ') {
    e.preventDefault();
    if (gameState === 'running') { gameState = 'paused'; clearTimeout(loopTimer); }
    else if (gameState === 'paused') { gameState = 'running'; startLoop(); }
  }
  if (e.key === 'Escape' && (gameState === 'running' || gameState === 'paused')) {
    gameState = 'idle';
    clearTimeout(loopTimer);
    initGame();
    startOverlay.classList.remove('hidden');
  }
});

// ─── 触摸控制 ─────────────────────────────────────────────
let touchStart = null;
canvas.addEventListener('touchstart', e => { touchStart = e.touches[0]; }, { passive: true });
canvas.addEventListener('touchend', e => {
  if (!touchStart || gameState !== 'running') return;
  const dx = e.changedTouches[0].clientX - touchStart.clientX;
  const dy = e.changedTouches[0].clientY - touchStart.clientY;
  if (Math.abs(dx) > Math.abs(dy)) {
    const d = dx > 0 ? DIRS.ArrowRight : DIRS.ArrowLeft;
    if (d.x !== -dir.x) nextDir = d;
  } else {
    const d = dy > 0 ? DIRS.ArrowDown : DIRS.ArrowUp;
    if (d.y !== -dir.y) nextDir = d;
  }
  touchStart = null;
}, { passive: true });

// ─── 初始绘制 ─────────────────────────────────────────────
initGame();
</script>
